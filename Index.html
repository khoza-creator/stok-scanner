<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera Live Barcode Gudang</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 12px; background: #f1f5f9; margin: 0; color: #0f172a; }
    .card { background: #ffffff; padding: 12px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); margin-bottom: 12px; }
    .mode-bar { display: flex; gap: 8px; margin-bottom: 8px; }
    .mode-btn { flex: 1; padding: 11px; border-radius: 8px; border: 2px solid transparent; font-weight: bold; font-size: 13px; cursor: pointer; opacity: 0.65; }
    .mode-masuk { background: #dcfce7; color: #166534; border-color: #16a34a; }
    .mode-keluar { background: #fee2e2; color: #991b1b; border-color: #dc2626; }
    .mode-btn.aktif { opacity: 1; box-shadow: 0 0 0 2px rgba(15,23,42,0.15); }
    .mode-status { font-size: 12px; font-weight: bold; text-align: center; padding: 7px; border-radius: 6px; background: #dcfce7; color: #166534; }
    .cam-wrapper { position: relative; width: 100%; background: #0f172a; border-radius: 8px; overflow: hidden; min-height: 210px; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; max-height: 260px; object-fit: cover; display: none; }
    .scan-line { position: absolute; left: 10%; right: 10%; height: 2px; background: rgba(239,68,68,0.9); pointer-events: none; display: none; }
    .cam-controls { display: flex; gap: 8px; margin-top: 8px; }
    .btn-cam { flex: 1; padding: 10px; border: none; border-radius: 7px; font-weight: bold; font-size: 12px; cursor: pointer; background: #0f766e; color: #fff; }
    .btn-cam.secondary { background: #e2e8f0; color: #0f172a; }
    label { font-weight: bold; display: block; margin-top: 9px; font-size: 12px; }
    input, select { width: 100%; padding: 9px; margin-top: 4px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px; }
    .new-box { border: 2px solid #f59e0b; background: #fffbeb; display: none; }
    .btn-simpan { width: 100%; padding: 11px; background: #1d4ed8; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 10px; cursor: pointer; }
    #status { text-align: center; font-weight: bold; margin-top: 9px; font-size: 13px; color: #1e40af; }
  </style>
</head>
<body>

  <div class="card">
    <div class="mode-bar">
      <button id="btnModeMasuk" type="button" class="mode-btn mode-masuk aktif" onclick="setMode('MASUK')">1-KLIK: MASUK</button>
      <button id="btnModeKeluar" type="button" class="mode-btn mode-keluar" onclick="setMode('KELUAR')">1-KLIK: KELUAR</button>
    </div>
    <div id="modeStatus" class="mode-status">Mode Aktif: BARANG MASUK (Terkunci hingga diganti)</div>
  </div>

  <div class="card">
    <div class="cam-wrapper">
      <video id="videoLive" playsinline muted autoplay></video>
      <div class="scan-line" id="scanLine"></div>
      <div id="fallbackReader" style="width:100%;display:none;"></div>
    </div>
    <div class="cam-controls">
      <button type="button" class="btn-cam" onclick="mulaiKameraLive()">MULAI KAMERA LIVE</button>
      <button type="button" class="btn-cam secondary" onclick="stopKameraLive()">MATIKAN</button>
    </div>
    <div id="camInfo" style="font-size:12px;color:#475569;margin-top:8px;">
      Tekan MULAI KAMERA LIVE untuk memindai barcode secara cepat.
    </div>
  </div>

  <div class="card new-box" id="formBarangBaru">
    <div style="font-weight:bold;color:#92400e;font-size:13px;">Barcode Belum Ada di Master Data — Daftarkan Barang Baru</div>
    <label>Barcode:</label>
    <input type="text" id="newBarcode" readonly style="background:#fef3c7;">
    <label>Nama Barang:</label>
    <input type="text" id="newNama" placeholder="Contoh: Kemeja Oxford Navy L">
    <label>Satuan:</label>
    <select id="newSatuan">
      <option value="Pcs">Pcs</option>
      <option value="Lusin">Lusin</option>
      <option value="Box">Box</option>
      <option value="Roll">Roll</option>
      <option value="Yard">Yard</option>
      <option value="Meter">Meter</option>
    </select>
    <label>Stok Awal:</label>
    <input type="number" id="newStokAwal" value="0" min="0">
    <button type="button" class="btn-simpan" style="background:#d97706;" onclick="simpanBarangBaru()">
      SIMPAN KE MASTER DATA & CATAT TRANSAKSI
    </button>
  </div>

  <div class="card">
    <label>Barcode Terbaca / Input Manual:</label>
    <input type="text" id="barcode" placeholder="Hasil scan atau ketik/scan eksternal...">
    <label>Qty per Scan:</label>
    <input type="number" id="qty" value="1" min="1">
    <label>Keterangan Sesi:</label>
    <input type="text" id="keterangan" placeholder="Contoh: SPK-012 / Gudang">
    <button type="button" class="btn-simpan" onclick="kirimKeAppsScript(document.getElementById('barcode').value.trim(), 'Barang Scan')">
      KIRIM TRANSAKSI SESUAI MODE
    </button>
    <div id="status"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwStJx0AxIcWHCNsRWm23lEPOlGQsCwb_XZ6iUPlhQY5zEdbRyNgCdkkccbuQWwT3qBNw/exec";
    let modeAktif = "MASUK";
    let sedangProses = false;
    let lastCode = "";
    let lastScanAt = 0;
    let streamAktif = null;
    let rafId = null;
    let barcodeDetector = null;
    let html5Fallback = null;
    let modeFallbackAktif = false;

    function setMode(mode) {
      modeAktif = mode;
      const masuk = document.getElementById("btnModeMasuk");
      const keluar = document.getElementById("btnModeKeluar");
      const st = document.getElementById("modeStatus");
      if (mode === "MASUK") {
        masuk.classList.add("aktif");
        keluar.classList.remove("aktif");
        st.innerText = "Mode Aktif: BARANG MASUK (Terkunci hingga diganti)";
        st.style.background = "#dcfce7";
        st.style.color = "#166534";
      } else {
        keluar.classList.add("aktif");
        masuk.classList.remove("aktif");
        st.innerText = "Mode Aktif: BARANG KELUAR (Terkunci hingga diganti)";
        st.style.background = "#fee2e2";
        st.style.color = "#991b1b";
      }
    }

    function bunyiBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.start();
        setTimeout(() => osc.stop(), 85);
      } catch (e) {}
    }

    async function mulaiKameraLive() {
      await stopKameraLive();
      const camInfo = document.getElementById("camInfo");
      const videoEl = document.getElementById("videoLive");
      const scanLine = document.getElementById("scanLine");
      const fallbackEl = document.getElementById("fallbackReader");

      try {
        streamAktif = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        videoEl.srcObject = streamAktif;
        videoEl.style.display = "block";
        scanLine.style.display = "block";
        fallbackEl.style.display = "none";
        modeFallbackAktif = false;

        if ("BarcodeDetector" in window) {
          barcodeDetector = new BarcodeDetector({
            formats: ["ean_13", "ean_8", "code_128", "code_39", "upc_a", "upc_e", "qr_code", "codabar", "itf"]
          });
          camInfo.innerText = "Kamera live aktif (BarcodeDetector cepat).";
          loopDeteksi();
        } else {
          videoEl.style.display = "none";
          scanLine.style.display = "none";
          fallbackEl.style.display = "block";
          modeFallbackAktif = true;
          stopStreamSaja();
          html5Fallback = new Html5Qrcode("fallbackReader");
          await html5Fallback.start(
            { facingMode: "environment" },
            { fps: 15, qrbox: { width: 280, height: 140 } },
            (txt) => handleHasilScan(txt),
            () => {}
          );
          camInfo.innerText = "Kamera live aktif (html5-qrcode).";
        }
      } catch (err) {
        camInfo.innerHTML = "<span style='color:#b91c1c;font-weight:bold;'>Gagal buka kamera: " + (err.name || "Error") + ". Cek izin kamera Chrome.</span>";
      }
    }

    function stopStreamSaja() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      if (streamAktif) { streamAktif.getTracks().forEach(t => t.stop()); streamAktif = null; }
    }

    async function stopKameraLive() {
      stopStreamSaja();
      document.getElementById("videoLive").style.display = "none";
      document.getElementById("scanLine").style.display = "none";
      if (html5Fallback && modeFallbackAktif) {
        try { await html5Fallback.stop(); await html5Fallback.clear(); } catch (e) {}
        document.getElementById("fallbackReader").style.display = "none";
        modeFallbackAktif = false;
      }
    }

    async function loopDeteksi() {
      const videoEl = document.getElementById("videoLive");
      if (!streamAktif || !barcodeDetector) return;
      if (videoEl.readyState >= 2 && !sedangProses) {
        try {
          const res = await barcodeDetector.detect(videoEl);
          if (res && res.length > 0 && res[0].rawValue) {
            handleHasilScan(res[0].rawValue);
          }
        } catch (e) {}
      }
      rafId = requestAnimationFrame(loopDeteksi);
    }

    function handleHasilScan(raw) {
      const code = String(raw || "").trim();
      const now = Date.now();
      if (!code || sedangProses) return;
      if (code === lastCode && (now - lastScanAt) < 1300) return;

      lastCode = code;
      lastScanAt = now;
      document.getElementById("barcode").value = code;
      bunyiBeep();
      kirimKeAppsScript(code, "Barang Scan");
    }

    async function simpanBarangBaru() {
      const kode = document.getElementById("newBarcode").value.trim();
      const nama = document.getElementById("newNama").value.trim();
      const satuan = document.getElementById("newSatuan").value;
      const stokAwal = Number(document.getElementById("newStokAwal").value || 0);
      if (!kode || !nama) { alert("Nama Barang wajib diisi."); return; }

      sedangProses = true;
      document.getElementById("status").innerText = "Mendaftarkan barang baru...";
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "tambahBarangBaru",
          item: { barcode: kode, nama: nama, satuan: satuan, stokAwal: stokAwal }
        })
      });
      document.getElementById("formBarangBaru").style.display = "none";
      sedangProses = false;
      kirimKeAppsScript(kode, nama);
    }

    async function kirimKeAppsScript(code, namaBarang) {
      const qty = Number(document.getElementById("qty").value || 1);
      const ket = document.getElementById("keterangan").value.trim();
      if (!code || qty <= 0) return;

      sedangProses = true;
      document.getElementById("status").innerText = `Mengirim [${modeAktif}] ${code} (${qty})...`;

      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "simpanTransaksi",
          data: { barcode: code, jenis: modeAktif, qty: qty, nama: namaBarang, keterangan: ket }
        })
      });

      document.getElementById("status").innerText = `Terkirim [${modeAktif}]: ${code} (${qty})`;
      document.getElementById("barcode").value = "";
      document.getElementById("qty").value = "1";
      sedangProses = false;
    }

    // Jika ingin mendaftarkan barang baru secara cepat, klik tombol di bawah saat diperlukan
    function bukaFormBarangBaruManual() {
      const code = document.getElementById("barcode").value.trim();
      document.getElementById("newBarcode").value = code;
      document.getElementById("formBarangBaru").style.display = "block";
    }
  </script>

  <div style="text-align:center;margin-bottom:20px;">
    <button type="button" onclick="bukaFormBarangBaruManual()" style="padding:8px 14px;border-radius:6px;border:1px solid #d97706;background:#fffbeb;color:#92400e;font-weight:bold;font-size:12px;">
      + Daftarkan Barcode Ini ke Master Data
    </button>
  </div>
</body>
</html>
